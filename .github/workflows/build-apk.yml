name: Build Flutter APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Android Release APK
        run: |
          cd android-app
          flutter pub get

          # Compatibility patch for flutter_bluetooth_serial with Android Gradle Plugin 8+
          PUB_CACHE_DIR="${HOME}/.pub-cache/hosted/pub.dev"
          PLUGIN_DIR=$(find "$PUB_CACHE_DIR" -maxdepth 1 -name "flutter_bluetooth_serial-*" | head -n 1)
          if [ -d "$PLUGIN_DIR" ]; then
            echo "Patching namespace & compileSdkVersion for flutter_bluetooth_serial..."
            sed -i '/android {/a \    namespace "io.github.edufolly.flutterbluetoothserial"' "$PLUGIN_DIR/android/build.gradle"
            sed -i 's/compileSdkVersion 30/compileSdkVersion 34/' "$PLUGIN_DIR/android/build.gradle"
          fi

          flutter build apk --release -v 2>&1 | tee build.log || (echo "=== BUILD ERROR TAIL ===" && tail -n 150 build.log && exit 1)

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: android-app/build.log

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: lilygo-netzwaechter-release-apk
          path: android-app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
