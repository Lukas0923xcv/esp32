name: Build Flutter APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android-app/android/app/netzwaechter.jks
          else
            echo "No KEYSTORE_BASE64 secret set, using debug signing"
          fi

      - name: Build Android Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          cd android-app
          flutter pub get

          # Compatibility patch for flutter_bluetooth_serial with Android Gradle Plugin 8+
          PUB_CACHE_DIR="${HOME}/.pub-cache/hosted/pub.dev"
          PLUGIN_DIR=$(find "$PUB_CACHE_DIR" -maxdepth 1 -name "flutter_bluetooth_serial-*" | head -n 1)
          if [ -d "$PLUGIN_DIR" ]; then
            echo "Patching namespace & compileSdkVersion for flutter_bluetooth_serial..."
            sed -i '/android {/a \    namespace "io.github.edufolly.flutterbluetoothserial"' "$PLUGIN_DIR/android/build.gradle"
            sed -i 's/compileSdkVersion 30/compileSdkVersion 34/' "$PLUGIN_DIR/android/build.gradle"
          fi

          flutter build apk --release --build-number=${{ github.run_number }} --dart-define=BUILD_NUMBER=${{ github.run_number }} --android-skip-build-dependency-validation

          cd ..
          mkdir -p android-app/build/app/outputs/flutter-apk
          APK_FILE=$(find . -name "app-release.apk" | head -n 1)
          echo "Found APK at: $APK_FILE"
          if [ -n "$APK_FILE" ] && [ "$APK_FILE" != "./android-app/build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp "$APK_FILE" android-app/build/app/outputs/flutter-apk/app-release.apk
          fi
          ls -lh android-app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android-app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish 'latest' release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create latest \
            android-app/build/app/outputs/flutter-apk/app-release.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Latest" \
            --notes "Automatic build of commit $GITHUB_SHA"
